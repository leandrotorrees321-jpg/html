<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulação de Segurança da Informação</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Consolas, monospace;
    color:#00ff41;
}

#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

.container{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    max-width:850px;
    width:100%;
    text-align:center;
    background:rgba(0,0,0,0.85);
    border:2px solid #00ff41;
    border-radius:15px;
    padding:40px;
    box-shadow:0 0 30px #00ff41;
}

.avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    border:3px solid #00ff41;
    margin-bottom:20px;
    box-shadow:0 0 25px #00ff41;
}

h1{
    font-size:2.8rem;
    margin-bottom:20px;
    text-shadow:0 0 15px #00ff41;
}

.typing{
    min-height:120px;
    font-size:1.2rem;
    line-height:1.8;
    margin-bottom:25px;
}

.warning{
    color:#ff4d4d;
    font-weight:bold;
    font-size:1.3rem;
    margin-bottom:15px;
}

.timer{
    margin-top:20px;
    font-size:2rem;
    color:#00ff41;
    text-shadow:0 0 10px #00ff41;
}

.footer{
    margin-top:30px;
    color:#ccc;
    font-size:0.9rem;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="card">

        <img
            class="avatar"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRdfUDhY3rqRuZMLJHEO7H8nC2fXTZJJYLxw&s"
            alt="Perfil"
        >

        <h1>ACESSO IDENTIFICADO<span class="blink">_</span></h1>

        <div class="warning">
            Atenção: Aviso Importante.
        </div>

        <div class="typing" id="texto"></div>

        <div class="timer">
            Encerrando em: <span id="contador">30</span>s
        </div>

        <div class="footer">
            Já • Te achamos • Estado do CE
        </div>

    </div>
</div>

<script>
// Efeito Matrix
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff41";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){

        const text = chars.charAt(
            Math.floor(Math.random()*chars.length)
        );

        ctx.fillText(
            text,
            i*fontSize,
            drops[i]*fontSize
        );

        if(
            drops[i]*fontSize > canvas.height &&
            Math.random() > 0.975
        ){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(draw,33);

// Texto digitando
const mensagem =
`Você acabou de ser hackeado por se passar por outra pessoa e praticar crimes virtuais.
Uma foto sua já foi tirada e coletada para reconhecimento, seu nome e número de telefone também foram coletados.
Em breve entraremos em contato com mais informações, não adianta apagar nada e nem sumir com provas.
.`;

let i = 0;
const alvo = document.getElementById("texto");

function digitar(){
    if(i < mensagem.length){
        alvo.innerHTML += mensagem.charAt(i);
        i++;
        setTimeout(digitar,20);
    }
}

digitar();

// Contador
let tempo = 30;

setInterval(()=>{
    tempo--;
    document.getElementById("contador").textContent = tempo;

    if(tempo <= 0){
        location.reload();
    }
},1000);
</script>

</body>
</html>
