<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Python + HTML</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
}

button{
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
}
</style>

</head>
<body>

<h1>Comunicação HTML → Python</h1>

<button onclick="executar()">
    Executar Python
</button>

<p id="resultado"></p>

<script>
async function chamarPython() {
    const resposta = await fetch("/executar");
    return await resposta.json();
}

async function executar() {

    let ultimoResultado;

    // 1 clique do usuário + 5 execuções automáticas
    for (let i = 0; i < 6; i++) {

        ultimoResultado = await chamarPython();
        window.open("youtube.com")
        document.getElementById("resultado").innerHTML =
            "Executado " + ultimoResultado.contador + " vez(es)";

        // espera 500ms entre as execuções
        if (i < 5) {
            await new Promise(resolve => setTimeout(resolve, 500));
        }
    }
}
</script>

</body>
</html>
