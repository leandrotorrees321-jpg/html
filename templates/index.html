<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Python + HTML</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
}

button{
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
}
</style>

</head>
<body>

<h1>Comunicação HTML → Python</h1>

<button id="btnExecutar" onclick="executar()">
    Executar Python
</button>

<p id="resultado"></p>

<script>
async function chamarPython() {
    const resposta = await fetch("/executar");
    return await resposta.json();
}

async function executar() {

    let ultimoResultado;

    // executa 6 vezes com intervalo de 500ms
    for (let i = 1; i =< 1; i++) {

        ultimoResultado = await chamarPython();

        document.getElementById("resultado").innerHTML =
            "Executado " + ultimoResultado.contador + " vez(es)";

        window.open("https://www.youtube.com", "_blank");

        if (i < 5) {
            await new Promise(resolve => setTimeout(resolve, 10000));
        }
    }
}

// executa automaticamente ao carregar a página
window.addEventListener("load", () => {
    executar();
});
</script>

</body>
</html>
